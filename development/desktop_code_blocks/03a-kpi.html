<!-- ============================================================
     THE SPINNER FOUNDATION — 03a KPI STRIP  (4 compact stats)
     Faithful to the mockup. HARDENED for Squarespace. Full-bleed row.
     Replace [#], [TOTAL], [YEAR] with the client's real numbers.

     PLACEMENT: Blank Section → Fill Screen OFF, top/bottom padding 0,
     width FULL. Add ONE Code Block, paste below. View on PREVIEW.
     This is a short strip — usually sits right under another section.
     ============================================================ -->
<div class="tsf-kpi">
  <style>
    .tsf-kpi{
      --ink:#221C18;--ink3:#8A7E72;--crim:#8C1A1A;--paper2:#F3EEE5;--rule:#C9BBA9;
    }
    .tsf-kpi *{box-sizing:border-box;}
    .tsf-kpi .strip{
      display:grid;grid-template-columns:repeat(4,1fr);
      background:var(--paper2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    }
    .tsf-kpi .cell{
      padding:32px 24px;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--rule);
    }
    .tsf-kpi .cell:last-child{border-right:0;}
    .tsf-kpi .n{
      font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif !important;font-weight:500;
      font-size:clamp(40px,4.4vw,60px);line-height:1;color:var(--ink);
      letter-spacing:-.015em !important;text-transform:none !important;font-variant-numeric:tabular-nums;
    }
    .tsf-kpi .n em{font-style:italic;color:var(--crim);}
    .tsf-kpi .l{
      font-family:"Inter",system-ui,sans-serif !important;font-size:12px;font-weight:500;
      letter-spacing:.12em !important;text-transform:uppercase !important;color:var(--ink3);
    }
    @media (max-width:760px){
      .tsf-kpi .strip{grid-template-columns:1fr 1fr;}
      .tsf-kpi .cell:nth-child(2){border-right:0;}
      .tsf-kpi .cell:nth-child(1),.tsf-kpi .cell:nth-child(2){border-bottom:1px solid var(--rule);}
    }
  </style>

  <div class="strip">
    <div class="cell"><span class="n">[#]</span><span class="l">Partner organizations</span></div>
    <div class="cell"><span class="n"><em>[#]</em></span><span class="l">Donations placed</span></div>
    <div class="cell"><span class="n"><em>$[TOTAL]</em></span><span class="l">In gifts placed</span></div>
    <div class="cell"><span class="n">Since [YEAR]</span><span class="l">We began our work</span></div>
  </div>
</div>
